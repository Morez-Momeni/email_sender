<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verification Code</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            background: #080808;
            font-family: Arial, Helvetica, sans-serif;
            color: #ffffff;
        }

        .wrapper {
            width: 100%;
            padding: 50px 15px;
            background: #080808;
        }

        .container {
            width: 100%;
            max-width: 430px;
            margin: 0 auto;
            background: #101010;
            border: 1px solid #222222;
            border-radius: 14px;
            overflow: hidden;
        }

        .top-line {
            height: 2px;
            background: #c9a227;
        }

        .content {
            padding: 42px 35px;
            text-align: center;
        }

        .brand {
            margin-bottom: 35px;
            color: #c9a227;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 4px;
        }

        .title {
            margin: 0;
            color: #ffffff;
            font-size: 24px;
            font-weight: 600;
            line-height: 1.5;
        }

        .description {
            margin: 12px auto 0;
            max-width: 330px;
            color: #777777;
            font-size: 13px;
            line-height: 1.8;
        }

        .code-box {
            margin: 28px 0 16px;
            padding: 18px 10px;
            background: #0b0b0b;
            border: 1px solid #292929;
            border-radius: 10px;
        }

        .code {
            color: #d4af37;
            font-family: "Courier New", monospace;
            font-size: 30px;
            font-weight: 700;
            letter-spacing: 9px;
        }

        .expiration {
            color: #555555;
            font-size: 11px;
        }

        .expiration span {
            color: #9b7b1e;
        }

        .divider {
            height: 1px;
            margin: 30px 0;
            background: #202020;
        }

        .notice {
            color: #666666;
            font-size: 11px;
            line-height: 1.8;
        }

        .support {
            margin-top: 22px;
            font-size: 11px;
            color: #555555;
        }

        .support a {
            color: #b99732;
            text-decoration: none;
        }

        .footer {
            margin-top: 30px;
            color: #3f3f3f;
            font-size: 10px;
        }

        @media only screen and (max-width: 480px) {
            .wrapper {
                padding: 25px 10px;
            }

            .content {
                padding: 35px 22px;
            }

            .title {
                font-size: 22px;
            }

            .code {
                font-size: 26px;
                letter-spacing: 7px;
            }
        }
    </style>
</head>

<body>

<table width="100%" cellpadding="0" cellspacing="0" border="0">
    <tr>
        <td class="wrapper">

            <table
                width="100%"
                cellpadding="0"
                cellspacing="0"
                border="0"
                class="container"
            >
                <tr>
                    <td class="top-line"></td>
                </tr>

                <tr>
                    <td class="content">

                        <div class="brand">
                            YOURAPP
                        </div>

                        <h1 class="title">
                            Verification Code
                        </h1>

                        <p class="description">
                            Enter the following code to continue
                            signing in to your account.
                        </p>

                        <div class="code-box">
                            <div class="code">
                                123456
                            </div>
                        </div>

                        <div class="expiration">
                            This code expires in
                            <span>10 minutes</span>.
                        </div>

                        <div class="divider"></div>

                        <div class="notice">
                            If you did not request this code,
                            you can safely ignore this email.
                        </div>

                        <div class="support">
                            Need help?
                            <a href="#">
                                Contact Support
                            </a>
                        </div>

                        <div class="footer">
                            © 2026 YOURAPP. All rights reserved.
                        </div>

                    </td>
                </tr>

            </table>

        </td>
    </tr>
</table>

</body>
</html>
